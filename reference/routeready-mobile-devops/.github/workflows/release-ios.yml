# Explicit iOS beta release. Separate package and beta jobs so a failed upload can be
# re-run WITHOUT rebuilding. Journey stations 7-10 · Bug Hunt b5, b6 · Drills 1, 2, 4, 15
name: release-ios

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (off = package and validate only)"
        type: boolean
        default: false

permissions:
  contents: write        # allocator commits to the build-numbers branch
  
concurrency:
  group: release-ios-routeready      # one per app/platform
  cancel-in-progress: false          # never kill an upload mid-flight

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-ios         # protected environment holds signing secrets
    outputs:
      build_number: ${{ steps.alloc.outputs.number }}
    env:
      XCODE_PATH: /Applications/Xcode_<VERIFY>.app
    steps:
      - uses: actions/checkout@<pin-full-commit-sha> # v4.x
      - run: sudo xcode-select -s "$XCODE_PATH"
      - uses: ruby/setup-ruby@<pin-full-commit-sha> # v1.x
        with:
          bundler-cache: true
      - name: Allocate build number (durable, concurrency-safe)
        id: alloc
        run: echo "number=$(./scripts/allocate-build-number.sh ios org.routeready.parent "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Package (temp keychain, readonly match, signed IPA + dSYMs)
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios package build_number:${{ steps.alloc.outputs.number }}
      - uses: actions/upload-artifact@<pin-full-commit-sha> # v4.x
        with:
          name: ios-release-${{ steps.alloc.outputs.number }}
          path: |
            build/ios/RouteReady.ipa
            build/ios/RouteReady.app.dSYM.zip
            evidence/release-manifest.json
          retention-days: 90         # longer than your support window for symbols (drill 19)
      - name: Remove temporary keychain
        if: always()
        run: bundle exec fastlane run delete_keychain name:fastlane_tmp_keychain || true

  beta:
    needs: package
    if: inputs.upload
    runs-on: macos-15
    timeout-minutes: 30
    environment: release-ios
    steps:
      - uses: actions/checkout@<pin-full-commit-sha> # v4.x
      - uses: ruby/setup-ruby@<pin-full-commit-sha> # v1.x
        with:
          bundler-cache: true
      - uses: actions/download-artifact@<pin-full-commit-sha> # v4.x
        with:
          name: ios-release-${{ needs.package.outputs.build_number }}
          path: build/ios
      - name: Upload the EXISTING IPA (verifies checksum first)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios beta ipa:build/ios/RouteReady.ipa manifest:build/ios/evidence/release-manifest.json
